
name: Build Angel Client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Przygotuj Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Zbuduj moda
      - name: Zbuduj moda
        working-directory: AngelClient
        run: gradle build --no-daemon


      - name: Sprawdź pliki JAR
        run: find . -type f -path '*/build/libs/*.jar' -print

      - name: Udostępnij plik JAR
        uses: actions/upload-artifact@v4
        with:
          name: AngelClient-JAR
          path: '**/build/libs/*.jar'
          if-no-files-found: error
